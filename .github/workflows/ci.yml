name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Gofmt check
        run: test -z "$(gofmt -l .)"

      - name: Test (with race detector)
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tee coverage.txt
          {
            echo "### Coverage"
            echo '```'
            tail -n 1 coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # 画像バイナリは外部から与えられるため、判定と圧縮の経路を毎回ファジングする。
      # 失敗した場合は再現用シードを internal/imgutil/testdata/fuzz/ にコミットして回帰テスト化する。
      - name: Fuzz DetectMIMEType
        run: go test ./internal/imgutil -run '^$' -fuzz FuzzDetectMIMEType -fuzztime 60s

      - name: Fuzz CompressToJPEG
        run: go test ./internal/imgutil -run '^$' -fuzz FuzzCompressToJPEG -fuzztime 60s

      - name: Upload fuzz failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-corpus
          path: internal/imgutil/testdata/fuzz/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          repo-checkout: false
